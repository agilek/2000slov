<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stránka nenalezena — 20 slov</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131f24" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="preload" href="/fonts/SlovkaOne-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<style>
    /* Neznámou cestu vrací Cloudflare s touhle stránkou (not_found_handling
       ve wrangler.toml). Cesta může být jakkoli hluboká, proto všechno z kořene. */
    .nf-page { gap: 0; }
    .nf-head {
        font-family: var(--display);
        font-weight: 300;
        font-size: 16px;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--muted-text);
        margin-bottom: 18px;
    }
    .nf-scene { position: relative; display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
    /* Duch z avatarů hry se vznáší nad kostkami. Vlnitý spodek, podle kterého
       je to duch, zůstává vidět, proto nekouká zpoza dlaždic. */
    .nf-avatar { width: 140px; height: 140px; margin-bottom: 14px; animation: nfPeek .6s .25s var(--spring) both, nfFloat 4s .9s ease-in-out infinite; }
    .nf-avatar svg { display: block; width: 100%; height: 100%; }
    /* Panenky se rozhlížejí (hledá stránku). Při zamíchání kostek na ně kouknou
       dolů. Jednotky jsou SVG body obličeje, panenka se vejde do bělma r=7. */
    .nf-pupil { animation: nfLook 5s 1.2s ease-in-out infinite; }
    .nf-avatar.nf-peek .nf-pupil { animation: nfPeekDown .9s ease-out; }
    .nf-q {
        position: absolute;
        top: -6px;
        left: calc(50% + 56px);
        font-family: var(--display);
        font-size: 40px;
        color: var(--gold);
        animation: nfPop .4s .8s var(--spring) both, nfAsk 2.8s 1.2s ease-in-out infinite;
    }
    .nf-q--2 { left: calc(50% + 82px); top: 18px; font-size: 26px; color: #ce82ff; animation-delay: 1s, 2.6s; }   /* otazníky se střídají */
    .nf-tiles {
        position: relative;
        display: flex;
        gap: 8px;
        background: none;
        border: 0;
        padding: 0 0 4px;
        cursor: pointer;
        touch-action: manipulation;
    }
    .nf-tiles:focus { outline: none; }
    .nf-tiles:focus-visible { outline: 3px solid var(--blue-soft); outline-offset: 6px; border-radius: 18px; }
    .nf-tiles .letter { width: 72px; height: 72px; font-size: 36px; cursor: inherit; animation: letterPop .32s var(--d, 0s) cubic-bezier(.34, 1.56, .64, 1) both; }
    .nf-tiles:active .letter { translate: 0 4px; box-shadow: 0 0 0 var(--lip); }
    /* Nula: nestihnutá, červená a spadlá na bok. */
    .nf-tiles .letter.nf-zero {
        background: var(--bad-bg);
        border-color: var(--bad-line);
        color: var(--bad-ink);
        box-shadow: 0 4px 0 var(--bad-line);
        rotate: 14deg;
        translate: 3px 7px;
        animation: letterPop .32s var(--d, 0s) cubic-bezier(.34, 1.56, .64, 1) both, nfTip .5s calc(var(--d, 0s) + .5s) cubic-bezier(.5, 1.8, .6, 1) both;
    }
    .nf-tiles:active .letter.nf-zero { translate: 3px 11px; }
    .screen p.nf-hint { font-size: 15px; font-weight: 700; color: var(--muted-text); margin: 18px 0 0; min-height: 1.5em; }
    .screen p.nf-hint.pulse { animation: pulse .3s; }
    .nf-page h1 { margin-bottom: 12px; }
    .screen p.nf-text { font-size: 18px; color: var(--muted-text); margin-bottom: 30px; max-width: 340px; margin-left: auto; margin-right: auto; }

    @keyframes nfPeek { from { translate: 0 40px; opacity: 0; } }
    @keyframes nfPop { from { scale: 0; opacity: 0; } }
    @keyframes nfAsk {
        0%, 60%, 100% { translate: 0 0; rotate: 0deg; scale: 1; }
        15% { translate: 0 -10px; rotate: -14deg; scale: 1.2; }
        30% { translate: 0 -4px; rotate: 10deg; scale: 1; }
        45% { translate: 0 0; rotate: -4deg; }
    }
    @keyframes nfLook {
        0%, 18%, 100% { transform: translate(0, 0); }
        28%, 46% { transform: translate(5.6px, 0); }
        56%, 72% { transform: translate(2.8px, -2.2px); }
        82%, 92% { transform: translate(0, 1.4px); }
    }
    @keyframes nfPeekDown { 20%, 75% { transform: translate(2.8px, 2.6px); } }
    @keyframes nfTip { from { rotate: 0deg; translate: 0 0; } }
    /* vznáší se a lehce se kolébá ze strany na stranu */
    @keyframes nfFloat {
        25% { translate: 0 -8px; rotate: -3deg; }
        50% { translate: 0 -3px; rotate: 0deg; }
        75% { translate: 0 -8px; rotate: 3deg; }
    }
    @media (prefers-reduced-motion: reduce) {
        .nf-avatar, .nf-q, .nf-pupil, .nf-tiles .letter, .nf-tiles .letter.nf-zero { animation: none; }
    }
</style>
</head>
<body>
<div class="screen active public-page nf-page">
    <div class="nf-head">Slovo 404 · neexistuje</div>

    <div class="nf-scene">
        <!-- Avatar ze hry (public/avatar.js): duch, oči stranou (hledá stránku), zmatená vlnka. -->
        <div class="nf-avatar" id="nfAvatar"></div>
        <span class="nf-q" aria-hidden="true">?</span>
        <span class="nf-q nf-q--2" aria-hidden="true">?</span>
        <button class="nf-tiles" id="nfTiles" type="button" aria-label="Zamíchat písmena 4, 0, 4"></button>
        <p class="nf-hint" id="nfHint" aria-live="polite">Klepni na kostky a zamíchej je</p>
    </div>

    <h1>Tohle slovo nemáme</h1>
    <p class="nf-text">Z písmen 4, 0 a 4 žádné podstatné jméno nesložíš. Duch to zkoušel celých 30&nbsp;sekund.</p>
    <a class="btn btn-play" href="/">Zpět do hry</a>
</div>
<script src="/squircle.js"></script>
<script src="/page.js"></script>
<script src="/avatar.js"></script>
<script>
(() => {
    const avatar = document.getElementById('nfAvatar');
    avatar.innerHTML = Avatar.svg('17-9-6-5');
    avatar.addEventListener('animationend', e => { if (e.animationName === 'nfPeekDown') avatar.classList.remove('nf-peek'); });
    // Panenky = tmavé tečky v očích (bělmo je bílý kruh pod nimi).
    avatar.querySelectorAll('.av-eye circle:not([fill="#fff"])').forEach(c => c.classList.add('nf-pupil'));
    // Vlnky dole: tělo (výplň i tmavší ret) přechází mezi tvarem avataru a tvarem
    // s prohozenými vlnami, sukně vlaje. SMIL, protože CSS `d` Safari animovat
    // neumí. Kdyby se tvar ducha v avatar.js změnil, B = A a vlnky jen stojí.
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        avatar.querySelectorAll('svg > g:not([transform*="scale"]) > path').forEach(path => {
            const a = path.getAttribute('d');
            const b = a.replace(/Q(\d+) (82|95)/g, (m, x, y) => `Q${x} ${y === '82' ? 95 : 82}`);
            if (a === b) return;
            const anim = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
            for (const [k, v] of Object.entries({ attributeName: 'd', values: `${a};${b};${a}`, dur: '1.4s',
                repeatCount: 'indefinite', calcMode: 'spline', keyTimes: '0;.5;1', keySplines: '.45 0 .55 1;.45 0 .55 1' })) anim.setAttribute(k, v);
            path.append(anim);
        });
    }
    const row = document.getElementById('nfTiles');
    const hint = document.getElementById('nfHint');
    // Víc než tři přesmyčky 404 nemá — a žádná z nich není slovo.
    const orders = ['404', '440', '044'];
    const quips = [
        'Pořád nic.',
        'Ani takhle to slovo není.',
        'Víc přesmyček tři kostky nemají.',
        'Duch začíná tušit, že to nepůjde.',
        'Nula se kutálí, stránka nikde.',
        'Tohle fakt není podstatné jméno.',
    ];
    let cur = 0, tries = 0;
    const draw = (animate) => {
        row.innerHTML = [...orders[cur]].map((ch, i) =>
            `<span class="letter${ch === '0' ? ' nf-zero' : ''}" style="--d:${animate ? i * 0.07 : 0.1 + i * 0.08}s">${ch}</span>`
        ).join('');
    };
    draw(false);
    row.addEventListener('click', () => {
        cur = (cur + 1 + Math.floor(Math.random() * 2)) % orders.length;
        draw(true);
        hint.textContent = quips[tries++ % quips.length];
        hint.classList.remove('pulse');
        void hint.offsetWidth;
        hint.classList.add('pulse');
        avatar.classList.remove('nf-peek');                // duch kouká, co se na kostkách stalo
        void avatar.offsetWidth;
        avatar.classList.add('nf-peek');
        if (navigator.vibrate) navigator.vibrate(8);
    });
})();
</script>
</body>
</html>
