<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <style>
    .w { transform-origin: 54px 68px; animation: bob 2.6s ease-in-out infinite; }
    .b { animation: breathe 2.6s ease-in-out infinite; }
    .z { transform-box: fill-box; transform-origin: center; opacity: 0; animation: float 2.6s ease-out infinite; }
    .z2 { animation-delay: .85s; }
    .z3 { animation-delay: 1.7s; }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-4px) rotate(3deg); } }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    @keyframes float {
      0% { opacity: 0; transform: translate(-4px, 8px) scale(.6); }
      25% { opacity: 1; }
      100% { opacity: 0; transform: translate(6px, -12px) scale(1.1); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .z { opacity: 1; } }
  </style>
  <g class="w">
    <rect x="42" y="16" width="24" height="8" rx="4" fill="#1b93e6"/>
