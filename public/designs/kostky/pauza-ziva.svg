    <circle cx="54" cy="68" r="28" fill="#fff"/>
    <path d="M28 55a28 28 0 0 1 16-18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".4"/>
    <g class="b">
