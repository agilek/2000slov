<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <style>
    .f { transform-origin: 24px 45px; animation: sway 1.7s ease-in-out infinite alternate; }
    .i { transform-origin: 24px 42px; animation: flick .62s ease-in-out infinite alternate; }
    .h { animation: glint 1.7s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: rotate(-3.5deg) scale(1, .96); } to { transform: rotate(3.5deg) scale(1, 1.04); } }
    @keyframes flick { from { transform: scale(.9, .84); } to { transform: scale(1.05, 1.07); } }
    @keyframes glint { from { opacity: .2; } to { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
