name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      # Worker importuje @pushforge/builder (Web Push). Závislost sedí
      # ve worker/package.json, a bez instalace ji esbuild při deployi
      # nenajde — "Could not resolve @pushforge/builder".
      - run: npm ci
        working-directory: worker
      # Statika (public/) i worker jdou ven jedním příkazem.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
